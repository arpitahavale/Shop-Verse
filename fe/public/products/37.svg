  <text x="400" y="318" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">#37</text>
  <text x="400" y="360" text-anchor="middle" fill="#14212b" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Walnut Desk</text>
    <text x="400" y="404" text-anchor="middle" fill="#14212b" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Organizer</text>
